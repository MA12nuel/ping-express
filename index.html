<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ping Express">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Escape the hunters by train across real rail networks.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ping Express</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: the map is the stage. Slim HUD on top, map in the middle, a station "departure board" sheet below with tabs.
   Single committed night look: deep alpine blue, amber LED for anything you can act on, red for the hunters. */
:root{
  --night:#0b1520; --deck:#122030; --deck2:#18293b; --rail:#253749; --track:#4f6476;
  --ink:#eaf0f5; --mute:#8aa0b3; --dim:#5d7184;
  --amber:#ffb547; --amber-ink:#1d1305; --signal:#ef4c52;
  --p0:#7fd0ff; --p1:#c19bff; --p2:#62dd9b; --p3:#ff9fc2;
  --ok:#5fd38a; --bad:#ff6b6b;
  /* light map surface in a road-map style */
  --m-sea:#9fd4f2; --m-sea2:#c4e7fa; --m-water:#8ccbee; --m-water-edge:#62afe0; --m-land:#fbf8f0; --m-land2:#ece8de; --m-coast:#d8ccb0; --m-border:#a18ccf; --m-country:#b2a6cf; --m-ink:#202124;
  --l-hs:#ff6b1a; --l-ic:#2f3b52; --l-ir:#6b7a90; --l-s:#94a3b8; --l-mtn:#e53950; --l-bus:#e8a400; --l-boat:#1f88e5; --l-route:#ff9f1c;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:8px 28px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);padding-block:4px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.hud .who{min-width:0}
.hud .role{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hud .run{font-family:var(--f-disp);font-weight:900;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .clock{font-family:var(--f-mono);font-weight:600;font-size:28px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.pingdial{width:46px;height:46px;position:relative;display:grid;place-items:center}
.pingdial svg{position:absolute;inset:0}
.pingdial b{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.pingdial small{position:absolute;bottom:-11px;font-size:9px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;white-space:nowrap}

/* map */
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--rail);background:var(--m-sea)}
#map{display:block;width:100%;height:clamp(260px,52vh,520px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.drag{cursor:grabbing}
.zoomctl{position:absolute;right:calc(8px + env(safe-area-inset-right,0px) * 0);top:8px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:40px;height:40px;border-radius:8px;border:1px solid #dadce0;background:#fff;color:#3c4043;box-shadow:0 1px 3px rgba(0,0,0,.25);font-family:var(--f-mono);font-size:17px;font-weight:600;display:grid;place-items:center;backdrop-filter:blur(4px)}
.zoomctl button.wide{font-size:10.5px;letter-spacing:.06em}
.maptip{position:absolute;left:8px;bottom:8px;right:56px;font-size:12px;color:#3c4043;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff}
.banner{position:absolute;left:8px;right:56px;top:8px;background:var(--signal);color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
.banner button{background:rgba(0,0,0,.25);border:0;border-radius:6px;padding:4px 10px;font-size:12px}
.targets{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px 3px 6px;border-radius:99px;background:var(--deck);border:1px solid var(--rail);color:var(--mute)}
.tchip i{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}
.tchip b{color:var(--ink);font-weight:500}
.tchip.me{border-color:currentColor}
.lbl{font-family:var(--f-body);fill:#5f6368;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.lbl.t1{fill:#202124;font-weight:600}
.lbl.on{fill:#202124;font-weight:600}
.lbl.go{fill:#b06000;font-weight:700}
.cluster{cursor:pointer}
@keyframes pulse{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.6}}

/* status */
.here{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.here .name{font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.here .lead{font-size:13px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rail);border-radius:10px;overflow:hidden;background:var(--deck)}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:8px 10px;min-width:0;border-right:1px solid var(--rail)}
.stat:last-child{border-right:0}
@media (max-width:460px){.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--rail)}}
.stat .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.a{color:var(--amber)} .v.r{color:var(--signal)} .v.g{color:var(--ok)}

.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.big{min-height:56px;border-radius:10px;border:1px solid var(--rail);background:var(--deck2);padding:10px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.big b{font-weight:600;font-size:15px}
.big small{font-size:12px;color:var(--mute)}
.big.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.big.primary small{color:#5f4012}
.big:disabled{opacity:.4;cursor:not-allowed}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rail)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--amber)}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--amber);margin-left:4px}

/* departure board */
.board{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--rail)}
.dep{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--deck);border:0;border-bottom:1px solid var(--rail);text-align:left;min-height:60px;width:100%}
.dep:last-child{border-bottom:0}
.dep:disabled{opacity:.42;cursor:not-allowed}
.dep.best{background:linear-gradient(90deg,rgba(255,181,71,.12),transparent 70%)}
.dep .time{font-family:var(--f-mono);font-weight:600;font-size:17px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.1}
.dep .time small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.dep .dest{min-width:0}
.dep .dest b{font-weight:600;font-size:15px;display:flex;gap:7px;align-items:center}
.dep .dest > span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .dest em{font-style:normal;color:var(--ok);font-weight:600}
.ty{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:3px;border:1px solid var(--track);color:var(--ink);letter-spacing:.02em}
.ty.IC{background:var(--ink);color:var(--night);border-color:var(--ink)}
.ty.MTN{border-color:var(--signal);color:#ff9a9d}
.ty.HS{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.ty.BUS{border-color:#c9b25a;color:#e6d38a}
.ty.BOAT{border-color:#5fa8d3;color:#8fd0f5}
.dep .cost{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--amber);text-align:right}
.dep .cost small{display:block;color:var(--mute);font-size:11px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:460px){.cards{grid-template-columns:1fr}}
.card2{border:1px solid var(--rail);border-radius:10px;background:var(--deck);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.card2:disabled{opacity:.42;cursor:not-allowed}
.card2 .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card2 b{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.card2 .price{font-family:var(--f-mono);font-size:12.5px;color:var(--amber);white-space:nowrap}
.card2 p{margin:0;font-size:13px;color:var(--mute)}
.card2 .state{font-size:12px;color:var(--ok);font-weight:600}
.card2.red{border-color:rgba(239,76,82,.6)}
.card2.red .price{color:#ff9a9d}
.card2 .side{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.card2.hunt{border-color:rgba(239,76,82,.55)} .card2.run{border-color:rgba(127,208,255,.45)}
.card2 .cnt{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
.deckinfo{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}

.plan{border:1px solid var(--amber);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(255,181,71,.08),transparent)}
.plan .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.plan .h b{font-weight:600}
.plan ol{margin:0;padding-left:18px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.plan ol b{color:var(--ink);font-weight:500}
.plan .x{background:none;border:1px solid var(--rail);border-radius:6px;font-size:12px;padding:4px 10px;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);border-left:2px solid var(--amber);padding-left:10px;margin:0}
.hint b{color:var(--ink)}
.log{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.log span{font-family:var(--f-mono);color:var(--dim);margin-right:8px;font-variant-numeric:tabular-nums}
.log .h{color:#ff9a9d} .log .s{color:var(--amber)} .log .r{color:var(--ink)}
.latest{font-size:13px;color:var(--mute);display:flex;gap:8px}
.latest span{font-family:var(--f-mono);color:var(--dim)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,9,14,.8);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.ov{align-items:center}}
.sheet{background:var(--deck);border:1px solid var(--rail);border-radius:14px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.08;letter-spacing:.02em;text-wrap:balance}
.sheet p{margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:48px;border-radius:8px;border:1px solid var(--rail);background:var(--night);padding:10px 14px;text-align:left}
.opt.right{border-color:var(--ok);color:var(--ok)} .opt.wrong{border-color:var(--bad);color:var(--bad)}
.est{display:flex;flex-direction:column;gap:8px}
.est output{font-family:var(--f-mono);font-size:32px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
.est input[type=range]{width:100%;accent-color:var(--amber);height:32px}
.fb{font-weight:600} .fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.hero .mark{font-family:var(--f-disp);font-weight:900;font-size:72px;line-height:.86;letter-spacing:.02em;color:var(--amber)}
.hero .mark span{color:var(--ink)}
.rules{display:grid;gap:10px}
.rule{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:14px}
.rule .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding-top:3px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goal{border:1px solid var(--rail);border-radius:8px;padding:8px 10px;min-width:0}
.goal .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.goal .v{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rail)}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .big{flex:1 1 160px}

/* ===== colour pass ===== */
body{background:radial-gradient(900px 520px at -10% -8%, #1d3a6b 0%, transparent 60%),radial-gradient(800px 520px at 115% 0%, #44205e 0%, transparent 58%),radial-gradient(700px 600px at 50% 120%, #0f4a4a 0%, transparent 60%),var(--night);background-attachment:fixed}
body::before{background:#13254a}
.hud{background:linear-gradient(100deg,#16305c 0%,#2b1c52 55%,#3d1747 100%);border:1px solid #33467a;border-radius:14px;padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hud .role{color:#b9c8ff}
.hud .clock{color:#ffd27a;text-shadow:0 0 14px rgba(255,180,70,.45)}
.stage{border:2px solid #33467a;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.targets .tchip{background:rgba(255,255,255,.04)}
.here .name{background:linear-gradient(90deg,#ffd27a,#ff8a5c 55%,#ff6fa8);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{border:0;background:none;gap:8px;overflow:visible}
.stat{border:1px solid var(--rail);border-radius:12px;background:var(--deck)}
.stat.s-kp{background:linear-gradient(160deg,rgba(255,181,71,.22),rgba(255,181,71,.04));border-color:rgba(255,181,71,.45)}
.stat.s-goal{background:linear-gradient(160deg,rgba(127,208,255,.22),rgba(127,208,255,.04));border-color:rgba(127,208,255,.45)}
.stat.s-zone{background:linear-gradient(160deg,rgba(98,221,155,.22),rgba(98,221,155,.04));border-color:rgba(98,221,155,.45)}
.stat.s-hunt{background:linear-gradient(160deg,rgba(239,76,82,.24),rgba(239,76,82,.05));border-color:rgba(239,76,82,.5)}
.stat.s-kp .k{color:#ffcf85}.stat.s-goal .k{color:#9fdcff}.stat.s-zone .k{color:#8ef0b8}.stat.s-hunt .k{color:#ff9a9d}
@media (max-width:460px){.stat{border-right:1px solid var(--rail)}.stat:nth-child(-n+2){border-bottom:1px solid var(--rail)}}
.big{border-radius:12px;background:linear-gradient(160deg,#1c3050,#162538);border-color:#2f4767}
.big.primary{background:linear-gradient(120deg,#ffc35a 0%,#ff8a4c 60%,#ff6a6a 100%);border:0;color:#2a1306;box-shadow:0 6px 16px rgba(255,120,70,.35)}
.big.primary small{color:#5b2a0b}
.tab[aria-selected=true]{border-bottom:3px solid;border-image:linear-gradient(90deg,#ffc35a,#ff6fa8) 1}
.board{border-radius:12px;border-color:#2f4767}
.dep{background:linear-gradient(90deg,#14243a,#122030)}
.dep.best{background:linear-gradient(90deg,rgba(255,181,71,.24),rgba(255,111,168,.08) 70%,transparent)}
.dep .time{color:#ffd27a}
.ty{border:0;padding:2px 6px}
.ty.IC{background:#e8eef3;color:#13202c}.ty.IR,.ty.RE{background:#8aa0b3;color:#0d1822}.ty.S{background:#4f6476;color:#fff}
.ty.HS{background:linear-gradient(90deg,#ff9a3c,#ff6a3c);color:#2a1306}.ty.MTN{background:#ef4c52;color:#fff}.ty.BUS{background:#f2c94c;color:#3a2a00}.ty.BOAT{background:#2f8be6;color:#fff}.ty.FLY{background:#3d8bfd;color:#fff}
.card2{border-radius:14px;border-width:1.5px;min-height:130px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card2 b{font-size:21px}
.card2.c-strike{background:linear-gradient(150deg,#6b1a24,#2b1219);border-color:#ef4c52}
.card2.c-decoy{background:linear-gradient(150deg,#4a2a7a,#1f1636);border-color:#a77bff}
.card2.c-silence{background:linear-gradient(150deg,#0f5560,#10262c);border-color:#3fd1d8}
.card2.c-freeride{background:linear-gradient(150deg,#1d6b45,#112a20);border-color:#5fd38a}
.card2.c-express{background:linear-gradient(150deg,#7a4a10,#2c1d0c);border-color:#ffb547}
.card2.c-block{background:linear-gradient(150deg,#7a1f3d,#2a1220);border-color:#ff6fa8}
.card2.c-xping{background:linear-gradient(150deg,#1b4f8a,#121f36);border-color:#7fd0ff}
.card2.c-delay{background:linear-gradient(150deg,#6e6312,#25220c);border-color:#f2d94c}
.card2 p{color:#d5dde6}
.card2 .side{color:#ffffffaa}
.plan{border-radius:12px;border-width:1.5px;background:linear-gradient(160deg,rgba(255,181,71,.16),rgba(255,111,168,.06))}
.hint{border-left:3px solid;border-image:linear-gradient(180deg,#ffc35a,#ff6fa8) 1;color:#c4d0dc}
.sheet{border-radius:18px;border:1px solid #3a4f80;background:linear-gradient(170deg,#182c4e 0%,#14223a 45%,#1f1735 100%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet .tag{color:#ffcf85}
.hero .mark{background:linear-gradient(90deg,#ffc35a,#ff8a4c 45%,#ff6fa8 75%,#a77bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .mark span{color:transparent;display:block;font-size:.62em;letter-spacing:.06em;margin-top:6px}
.opt{display:flex;gap:12px;align-items:center;border-radius:12px;background:#0f1b2b;border-width:1.5px}
.opt .ltr{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:#14202c}
.opt:nth-child(1) .ltr{background:#7fd0ff}.opt:nth-child(2) .ltr{background:#c19bff}.opt:nth-child(3) .ltr{background:#62dd9b}.opt:nth-child(4) .ltr{background:#ff9fc2}
.opt.right{background:rgba(95,211,138,.15)}.opt.wrong{background:rgba(255,107,107,.15)}
.goal{border-radius:12px;border-width:1.5px;background:rgba(255,255,255,.04)}
.rule .k{color:#ff9fc2}
table tr:first-child td{color:#ffd27a}

.nonstop{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:linear-gradient(90deg,#ff9a3c,#ff6fa8);color:#2a1306}

/* challenges */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tier{border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid;min-height:96px}
.tier b{font-family:var(--f-disp);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.tier span{font-family:var(--f-mono);font-weight:600;font-size:15px}
.tier small{font-size:11px;color:#d5dde6}
.t-bronze{background:linear-gradient(150deg,#7a4520,#2e1c10);border-color:#d08a4a}.t-bronze b,.t-bronze span{color:#ffc08a}
.t-silver{background:linear-gradient(150deg,#55606f,#232a33);border-color:#c9d3df}.t-silver b,.t-silver span{color:#eef3f8}
.t-gold{background:linear-gradient(150deg,#8a6a10,#2f2508);border-color:#ffcf4a}.t-gold b,.t-gold span{color:#ffe08a}
.dbl{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#d5dde6;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.dbl input{width:20px;height:20px;accent-color:#ff8a4c;margin-top:2px}
.chcard{border-radius:16px;padding:22px 18px;border:2px solid;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.chcard .chtype{font-family:var(--f-disp);font-weight:900;font-size:30px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.chcard p{color:#eef3f8}
.clockface{width:min(240px,70%);align-self:center;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.pinmap{width:100%;height:auto;border-radius:12px;background:var(--m-sea);cursor:crosshair;touch-action:manipulation}
.track{width:100%;height:auto;background:linear-gradient(180deg,#bfe3f7,#e9f5fb);border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border-radius:99px;padding:10px 14px;border:1.5px solid #4a5f93;background:#1b2b47;font-weight:600;min-height:44px}
.chipbtn.right{border-color:var(--ok);color:var(--ok)}.chipbtn.wrong{border-color:var(--bad);color:var(--bad)}
.picked{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;min-height:24px;font-weight:600;color:#ffd27a}
.picked li.bad{color:var(--bad)}
.tf-true{background:linear-gradient(120deg,#2d9b62,#1d6b45);border:0}.tf-false,.tf-fake{background:linear-gradient(120deg,#c2416f,#7a1f3d);border:0}
.tf-true b,.tf-fake b{font-size:20px;color:#fff}
.chres{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--rail)}
.chres .ann{font-style:italic;color:#c4d0dc;font-size:13.5px}

/* two players */
.ov.solid{background:#070d14}
.handoff{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:18px 4px 6px}
.handoff .hoav{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:36px;color:#0b1520}
.handoff p{color:#c4d0dc;max-width:30ch}
.handoff .big{align-self:stretch}
.pcount{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{border-radius:14px;padding:12px;text-align:left;border:1.5px solid var(--rail);background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px;min-height:64px}
.pc b{font-size:16px}.pc small{font-size:12px;color:var(--mute)}
.pc.on{border-color:#ff8a4c;background:linear-gradient(140deg,rgba(255,138,76,.22),rgba(255,92,138,.12))}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names input{font:inherit;font-size:16px;color:var(--ink);background:#0f1c2c;border:1.5px solid var(--rail);border-radius:12px;padding:10px 12px;min-width:0}
.names input:nth-child(1){border-color:#7fd0ff}.names input:nth-child(2){border-color:#c19bff}

/* challenge v2 */
.mono{font-family:var(--f-mono)}
.big.veto{background:linear-gradient(120deg,#5a1f2e,#2a121b);border-color:#ff6b6b}.big.veto b{color:#ff9a9a}
.timer{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#62dd9b,#ffcf4a);border-radius:99px}
.timer i.hot{background:linear-gradient(90deg,#ff6b6b,#ff9f1c)}
.memline{margin:0;padding:14px 14px 14px 36px;border-radius:14px;background:#0f1c2c;border-left:6px solid #e8343b;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:18px}
.doorbtn{align-self:center;width:min(260px,80%);aspect-ratio:1;border-radius:28px;border:3px solid #3b4a5c;background:linear-gradient(180deg,#d9dee4,#9aa6b2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#1b2430;touch-action:manipulation}
.doorbtn b{font-family:var(--f-disp);font-size:26px;letter-spacing:.04em}
.lamp{width:84px;height:84px;border-radius:50%;background:#d6232a;box-shadow:0 0 30px #d6232a99,inset 0 -6px 10px #0004}
.lamp.go{background:#2bd46f;box-shadow:0 0 40px #2bd46fcc,inset 0 -6px 10px #0004}
.lamp.bad{background:#5a1f2e;box-shadow:none}
.dots{text-align:center;font-size:24px;letter-spacing:.3em;color:#ffcf4a;margin:0}
.tvm{border-radius:18px;background:linear-gradient(180deg,#2f7fa8,#1b4f6e);padding:14px;display:flex;flex-direction:column;gap:12px}
.tvm-scr{background:#0b1520;border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:baseline}
.tvm-scr small{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.tvm-scr b{font-family:var(--f-mono);font-size:22px;color:#ffcf4a;text-align:right}
.tvm-scr b.over{color:#ff6b6b}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coin{aspect-ratio:1;border-radius:50%;border:3px solid #8a8f96;background:radial-gradient(circle at 35% 30%,#f4f6f8,#b8bec6 70%);color:#2a2f36;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:manipulation}
.coin small{font-size:10px;font-weight:600}
.coin.c500{border-color:#7a6a3a;background:radial-gradient(circle at 35% 30%,#fff7d6,#c9b26a 70%)}
.coin:active{transform:scale(.94)}
.tvm .big{background:#0b1520}

/* tutorial coach */
.coach{position:fixed;left:12px;right:12px;z-index:40;background:linear-gradient(140deg,#24345a,#3a2350);border:1.5px solid #ff8a4c;border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;color:#eef3f8;font-size:15px;line-height:1.45}
.coach.top{top:12px}.coach.bot{bottom:12px}
.coach p{margin:0}
.coach .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.coach .n{font-family:var(--f-mono);font-size:11.5px;color:#ffcf4a;letter-spacing:.12em}
.coach .lnk{background:none;border:0;color:#c4d0dc;text-decoration:underline;font-size:13px;padding:6px 0;min-height:32px}
.tut-hl{outline:3px solid #ff8a4c !important;outline-offset:3px;animation:tutp 1.4s infinite;position:relative;z-index:5}
@keyframes tutp{0%,100%{box-shadow:0 0 0 0 rgba(255,138,76,.65)}50%{box-shadow:0 0 0 12px rgba(255,138,76,0)}}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none}}
.dep.tut-hl,.stage.tut-hl{outline-offset:-3px}
/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border-radius:14px;padding:12px 14px;border:1.5px solid var(--rail);background:rgba(255,255,255,.04);min-height:60px}
.setrow span{display:flex;flex-direction:column;gap:2px}.setrow b{font-size:16px}.setrow small{font-size:12.5px;color:var(--mute)}
.sw{flex:none;width:46px;height:26px;border-radius:99px;background:#33445a;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#dfe7ef;transition:transform .2s}
.sw.on{background:#2bd46f}.sw.on::after{transform:translateX(20px)}
.subh{margin:4px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.diffs{display:grid;grid-template-columns:1fr;gap:8px}
#zSet,#zHome{display:grid;place-items:center}
@media (min-width:640px){.coach{position:absolute}}
.copy{color:var(--mute);font-size:12px;text-align:center;margin:4px 0 0}.copy a{color:inherit}

/* ===== map design v2 ===== */
:root{--m-sea:#a9d9f2;--m-sea2:#c9e9fa;--m-water:#93cff0;--m-water-edge:#6db6e3;--m-land:#f8f5ee;--m-land2:#ebe7de;--m-coast:#d6cbb2;--m-border:#b7aad6;--m-country:#b8adcf;
  --l-hs:#ff5a1f;--l-ic:#2a3a58;--l-ir:#56677f;--l-re:#7a889c;--l-s:#8fa0b6;--l-mtn:#d6334a;--l-bus:#d99a00;--l-boat:#1f88e5;--l-route:#ff9f1c;--l-case:#ffffff}
.zoomctl{top:8px;right:8px;gap:5px}
.zoomctl button{width:36px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,.92);color:#1f2d45;box-shadow:0 2px 8px rgba(16,26,43,.22);font-size:18px}
.zoomctl button:active{transform:scale(.94)}
.zoomctl button.on{background:#1f2d45;color:#fff}
.zoomctl #zIn{border-radius:11px 11px 4px 4px}.zoomctl #zOut{border-radius:4px 4px 11px 11px;margin-top:-4px}
.maptip{left:10px;right:auto;bottom:10px;max-width:calc(100% - 70px);background:rgba(255,255,255,.92);color:#1f2d45;text-shadow:none;padding:6px 10px;border-radius:999px;font-size:11.5px;font-weight:600;box-shadow:0 2px 8px rgba(16,26,43,.18)}
.maptip:empty{display:none}
.lbl{fill:#4b5563}.lbl.t1,.lbl.on{fill:#111827}
#map.drag{cursor:grabbing}
/* station card */
.selcard{position:absolute;left:8px;right:54px;bottom:8px;z-index:4;background:#0e1828;color:#eef3f8;border:1px solid #33467a;border-radius:16px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;animation:scIn .18s ease-out}
@keyframes scIn{from{transform:translateY(14px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.selcard{animation:none}}
.sc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sc-name{font-family:var(--f-disp);font-weight:800;font-size:17px;line-height:1.1}
.sc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tg{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid #4a5f93;color:#c4d0dc}
.tg.goal{border-color:#62dd9b;color:#62dd9b}.tg.zone{border-color:#7fd0ff;color:#7fd0ff}.tg.ping{border-color:#ff6b6b;color:#ff8a8a}
.sc-x{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#dfe7ef;font-size:15px}
.sc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sc-sum div{background:rgba(255,255,255,.06);border-radius:9px;padding:4px 8px;display:flex;flex-direction:column}
.sc-sum b{font-family:var(--f-mono);font-size:15px;color:#ffcf4a}.sc-sum small{font-size:10.5px;color:#9fb0c3}
.sc-route{font-size:12px;color:#c4d0dc;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-route span{color:#ff9f1c}
.sc-none{margin:0;font-size:13px;color:#9fb0c3}
.selcard .big{min-height:44px;padding:6px 12px}.selcard .big b{font-size:15px}.selcard .big small{font-size:11.5px}
.sc-x{width:30px;height:30px}
/* full screen map */
body.mapfs .stage{position:fixed;inset:0;z-index:30;border-radius:0}
body.mapfs #map{height:100%!important;height:100dvh!important}
@media (min-width:640px){body.mapfs .stage{position:absolute}}
@media (max-width:420px){#map{height:min(58vh,520px)}}
/* ===== phone frame on larger screens ===== */
.app > *{flex-shrink:0}
.ty{display:inline-block;line-height:1.35}
.phone,.screen{position:relative}
.stage{border:0;box-shadow:0 0 0 2px #4a5f93,0 10px 26px rgba(0,0,0,.4);border-radius:16px}
@media (min-width:640px){
  html,body{height:100%}
  body{display:grid;place-items:center;padding-block:20px;overflow:hidden;
    background:radial-gradient(800px 600px at 15% 10%,#24406f 0%,transparent 60%),radial-gradient(800px 600px at 85% 90%,#4a2266 0%,transparent 60%),#070c14}
  body::before{display:none}
  .phone{width:min(410px,calc(100vw - 32px));height:min(880px,calc(100vh - 40px));border-radius:52px;padding:11px;
    background:linear-gradient(150deg,#3a4152 0%,#14171e 45%,#2a2f3a 100%);
    box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 0 0 1.5px #5a6273,inset 0 0 0 4px #0b0d12}
  .phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:18px;background:#000;z-index:40}
  .phone::after{content:"";position:absolute;right:-3px;top:150px;width:4px;height:70px;border-radius:2px;background:#2a2f3a}
  .screen{height:100%;border-radius:42px;overflow:hidden;
    background:radial-gradient(600px 400px at -10% -5%,#1d3a6b 0%,transparent 60%),radial-gradient(500px 420px at 115% 5%,#44205e 0%,transparent 58%),radial-gradient(500px 500px at 50% 115%,#0f4a4a 0%,transparent 60%),var(--night)}
  .app{height:100%;overflow-y:auto;overflow-x:hidden;max-width:none;padding:58px 14px 28px;scrollbar-width:none}
  .app::-webkit-scrollbar{display:none}
  .hud{top:0}
  #map{height:340px}
  .ov{position:absolute;padding:14px;border-radius:42px}
  .sheet{max-height:calc(100% - 44px)}
  .tiles,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{border-right:1px solid var(--rail)}
  .cards{grid-template-columns:1fr}
  .goals{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* overview v3 */
.tgtptr{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:999px;border:0;background:rgba(16,26,43,.88);color:#fff;font:600 11.5px var(--f-body);box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;max-width:170px}
.tgtptr i{font-style:normal;color:#ffd27a;font-size:13px;display:inline-block}
.tgtptr span{display:flex;flex-direction:column;line-height:1.15;min-width:0;text-align:left}
.tgtptr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgtptr small{color:#ffd27a;font:500 10px var(--f-mono)}
.legend{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;width:100%;flex:0 0 100%;font-size:10.5px;color:var(--mute);white-space:nowrap}
.legend::-webkit-scrollbar{display:none}
.lg{display:inline-flex;align-items:center;gap:4px}
.targets{flex-wrap:wrap}
.hud .role{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .run{font-size:19px}
.dep .time small{white-space:nowrap}
@media (max-width:460px){
  .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .stat{padding:6px 7px;border-right:1px solid var(--rail)!important;border-bottom:1px solid var(--rail)!important}
  .stat .k{font-size:9px;letter-spacing:.08em}
  .stat .v{font-size:14.5px}
  .stat .s{font-size:9.5px;white-space:normal;line-height:1.2;max-height:2.4em}
  .here .name{font-size:26px}
}

/* leaderboard */
.lbmaps{display:flex;flex-wrap:wrap;gap:6px}.lbmaps .pc{padding:6px 11px;flex:0 0 auto;min-height:0;height:auto;border-radius:99px}.lbmaps .pc b{font-size:12.5px}
.sheet h3{margin:14px 0 6px;font-size:15px}
tr.me td{color:#ffd27a}
.scorebox{margin:12px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(160deg,rgba(255,181,71,.22),rgba(255,111,168,.08));border:1px solid rgba(255,181,71,.45);text-align:center}
.scorebox .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ffcf85}
.scorebox .pts{font:700 40px var(--f-mono);color:#ffd27a;line-height:1.1}
.scorebox .s{font-size:12px;color:var(--mute)}
.scorebox .pb{margin-top:6px;font-weight:700;color:#62dd9b}
.lbsend{display:flex;flex-direction:column;gap:8px}
.lbsend input{padding:11px 12px;border-radius:10px;border:1px solid var(--rail);background:var(--deck);color:var(--ink);font:500 15px var(--f-body)}

/* delays */
.dep .time .dl{font-style:normal;font-size:12px;font-weight:700;color:#ff6b6b;margin-left:4px}
.dep .time small.cx{color:#ff6b6b;text-decoration:line-through;font-size:10px}

.mflag{margin-right:8px;font-size:1.15em;letter-spacing:1px}
</style>
</head>

    </div>

  });
  if (R.ping && human === "hunter") {
    const P = R.ping.pos;
    let [px, py] = PX(R.ping.node);
    if (P) { const [ax, ay] = PX(P.from), [bx, by] = PX(P.to); px = ax + (bx - ax) * P.f; py = ay + (by - ay) * P.f;
      h += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--signal)" stroke-width="5" stroke-opacity=".35" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${px}" cy="${py}" r="${6 * u}" fill="var(--signal)" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>`; }
    h += `<circle class="pulse" cx="${px}" cy="${py}" r="${15 * u}" fill="none" stroke="var(--signal)" stroke-width="2.4" vector-effect="non-scaling-stroke"/>`; }
  R.hunters.forEach(hu => {
    const [hx, hy] = posOf(hu), mine = !isBot(hu), t = (mine ? 11 : 9) * u;
    h += `<path d="M${hx} ${hy - t} L${hx + t * .9} ${hy + t * .65} L${hx - t * .9} ${hy + t * .65} Z" fill="${hu.p.hex}" stroke="var(--signal)" stroke-width="${mine ? 3 : 2.2}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  });
  if (human !== "hunter" || R.status !== "play") { const [rx, ry] = posOf(R.rn);
    h += `<circle class="pulse" cx="${rx}" cy="${ry}" r="${12 * u}" fill="none" stroke="${R.runnerP.dark}" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <circle cx="${rx}" cy="${ry}" r="${7 * u}" fill="${R.runnerP.hex}" stroke="#202124" stroke-width="2.2" vector-effect="non-scaling-stroke"/>`; }
  /* target flag + off-screen pointer */
  const tgt = human === "hunter" ? (R.ping ? R.ping.node : null) : R.goal;
  M.goals.forEach((g, i) => { const [gx, gy] = PX(g), f = i === R.ri ? 1 : .7;

      <path d="M${gx} ${gy - 30 * f * u} L${gx + 15 * f * u} ${gy - 25 * f * u} L${gx} ${gy - 20 * f * u} Z" fill="${PLAYERS[i].hex}" stroke="#202124" stroke-width="1.3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>`; });

        ptr.style.left = Math.max(70, Math.min(w - 70, px)) + "px"; ptr.style.top = Math.max(24, Math.min(H2 - 24, py)) + "px";

  const bx = $("bnX"); if (bx) bx.onclick = () => { UI.mode = null; renderMap(); };

}

/* ---------- deck (bottom sheet) ---------- */
function depRow(e, opts) {
  const from = opts.from || R.t, sd = opts.now ? Math.max(R.t, from) : nextDep(e, from), dl = opts.now ? 0 : delayOf(e, sd), dep = sd + dl, wait = dep - R.t, arr = dep + e.min;

    <div class="time">${clock(sd)}${dl ? `<i class="dl">+${dl}</i>` : ""}<small>${wait <= 0 ? "now" : "in " + wait + " min"}</small>${cx !== null ? `<small class="cx">${clock(cx)} cancelled</small>` : ""}</div>

  else h += latest;
  deck.innerHTML = h;
  deck.querySelectorAll(".tab").forEach(b => b.onclick = () => { UI.tab = b.dataset.tab; renderDeck(); });
  deck.querySelectorAll(".dep:not([disabled])").forEach(b => b.onclick = () => {

    if (runner) runnerBook(e); else hunterBook(me, e);
    if (UI.sel === b.dataset.to) UI.sel = null;
    SFX.depart();
    advance(); toTop(); tutEvent("booked");
  });
  deck.querySelectorAll(".card2[data-card]:not([disabled])").forEach(b => b.onclick = () => {
    const k = b.dataset.card;
    if (k === "block") { UI.mode = "block"; V.z = Math.max(V.z, G.focus * .7); renderMap(); const st = document.querySelector(".stage"); if (st && st.scrollIntoView) st.scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
    playCard(ME().id, k); advance();
  });
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on("bQuiz", openChallenge);
  on("bCards", () => { UI.tab = "cards"; renderDeck(); });
  on("bClr", () => { UI.sel = null; render(); });
  on("bWait", () => { me.busy = R.t + 5; advance(); });
}

function finishChallenge(ok, detail) {
  const T = TIERS[CH.tier], gain = T.reward * (CH.double ? 2 : 1), loss = CH.double ? Math.min(R.kp, T.reward) : 0;
  const msg = ok ? rnd(WIN_LINES) : rnd(FAIL_LINES);

  const fb = document.createElement("div");
  fb.className = "chres " + (ok ? "ok" : "no");

    <button class="big primary" id="chDone"><b>Continue</b></button>`;
  $("sheet").appendChild(fb); fb.scrollIntoView && fb.scrollIntoView({block:"nearest"});

function botChallenge(P, need, eta) {

}

      ${M.best ? `<div class="pb">New personal best on ${esc(G.label)}!</div>` : ""}</div>
    ${LB_ON() ? `<div class="lbsend"><input id="lbName" maxlength="14" placeholder="Your name" value="${esc(nm)}" aria-label="Name for the world leaderboard"><button class="big primary" id="lbGo"><b>Send to world leaderboard</b><small>Your name and points become public</small></button></div><p class="hint" id="lbMsg"></p>` : ""}
    <button class="big" id="lbShow"><b>Leaderboard</b><small>${esc(G.label)}</small></button>`;
}
function wireFinalScore() {
  const show = $("lbShow"); if (show) show.onclick = () => showLeaderboard(M.mode, showFinal);
  const go = $("lbGo"); if (!go) return;
  if (M.sent) { go.disabled = true; $("lbMsg").textContent = "Sent. Thanks!"; }
  go.onclick = () => {
    const name = ($("lbName").value || "").replace(/[^\p{L}\p{N} ._-]/gu, "").trim().slice(0, 14);
    if (name.length < 2) { $("lbMsg").textContent = "Please enter a name (at least 2 letters)."; return; }
    store("pe-name", name); go.disabled = true; $("lbMsg").textContent = "Sending…";
    const me = PLAYERS.find(p => p.human), mp = matchPoints(me.id);
    lbSubmit({name, map:M.mode, score:mp.total, escapes:mp.escapes, catches:mp.catches, diff:M.diff || "normal"})
      .then(() => { M.sent = true; $("lbMsg").textContent = "Sent. Thanks!"; })
      .catch(() => { go.disabled = false; $("lbMsg").textContent = "Couldn't send. Check your connection and try again."; });
  };
}
function showIntro(step) {
  if (step !== "rules") {
    showOv(`<div class="hero"><div class="mark">PING<span>EXPRESS</span></div><div class="tag">A rail chase across Europe and the USA</div></div>
      ${(() => { const sv = savedInfo(); return sv ? `<button class="big primary" id="bCont"><b>Continue match</b><small>${esc(sv)}</small></button>` : ""; })()}
      <div class="btnrow"><button class="big ${load("escape-tut") ? "" : "primary"}" id="bTut"><b>${load("escape-tut") ? "Tutorial" : "New here? Tutorial"}</b><small>A guided practice round, about 2 min</small></button>
        <button class="big" id="bSet2"><b>Settings</b><small>Sound · ${DIFFS[SET.diff].name}</small></button>
        <button class="big" id="bLB"><b>Leaderboard</b><small>Best matches per map</small></button></div>
      <h2>Players</h2>
      <div class="pcount"><button class="pc ${PLAY2 ? "" : "on"}" data-pc="1"><b>1 player</b><small>You vs 3 bots</small></button>
        <button class="pc ${PLAY2 ? "on" : ""}" data-pc="2"><b>2 players</b><small>One phone, pass it on · 2 bots</small></button></div>
      <div class="names" ${PLAY2 ? "" : "hidden"}><input id="n1" maxlength="12" value="${esc(NAMES[0])}" aria-label="Name player 1"><input id="n2" maxlength="12" value="${esc(NAMES[1])}" aria-label="Name player 2"></div>
      <h2>Choose a map</h2>
      <div class="btnrow" style="flex-direction:column">
        ${Object.entries(MODES).map(([k, m]) => `<button class="big ${k === "ch" ? "primary" : ""}" data-mode="${k}"><b><span class="mflag">${m.flag || ""}</span>${m.label}</b><small>${MAP.stations.filter(x => ((x.c === "US") === ((m.base || k) === "us")) && ((m.extra || []).includes(x.id) || ((!m.countries || m.countries.includes(x.c)) && (!x.o || x.o === (m.base || k)) && !((m.base || k) === "eu" && x.x) && !(k === "ch" && x.id.startsWith("I_")))) && !(m.hide || []).includes(x.id)).length} stations · ${m.sub}</small></button>`).join("")}
      </div>
      <p style="color:var(--mute);font-size:13px">Travel times are rounded typical values of the fastest regular service, not a live timetable.</p>
      <p class="copy">© 2026 Ping Express · All rights reserved${location.protocol.startsWith("http") && !/claude/.test(location.hostname) ? ` · <a href="privacy.html">Privacy</a>` : ""}</p>`);
    let two = PLAY2;
    $("bTut").onclick = startTutorial;
    $("bSet2").onclick = () => openSettings(() => showIntro());
    $("bLB").onclick = () => showLeaderboard(null, () => showIntro());
    if ($("bCont")) $("bCont").onclick = () => { if (!resumeGame()) showIntro(); };
    $("sheet").querySelectorAll("[data-pc]").forEach(b => b.onclick = () => { two = b.dataset.pc === "2";
      $("sheet").querySelectorAll("[data-pc]").forEach(x => x.classList.toggle("on", x === b)); $("sheet").querySelector(".names").hidden = !two; });
    $("sheet").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
      const nm = [($("n1").value || "").trim() || "Player 1", ($("n2").value || "").trim() || "Player 2"];
      if (nm[0] === nm[1]) nm[1] += " 2";
      setPlayers(two, nm); newMatch(b.dataset.mode); startRound(); showIntro("rules"); });
    return;
  }
  const goals = PLAYERS.map((p, i) => `<div class="goal" style="border-color:${p.hex}"><div class="k" style="color:${p.hex}">${esc(p.name)}</div><div class="v">${esc(S[M.goals[i]].name)}</div></div>`).join("");
  const rule = (k, x) => `<div class="rule"><div class="k">${k}</div><div>${x}</div></div>`;
  showOv(`<div class="tag">${esc(G.label)} · ${IDS.length} stations</div><h2>How it works</h2>
    <div class="rules">
      ${rule("Match", (PLAY2 ? esc(NAMES[0]) + " and " + esc(NAMES[1]) + " on one phone, plus two bots. When it's the other player's turn, the game asks you to pass the phone." : "You and three bots.") + " Everyone runs twice: 8 rounds. Round 1 starts at <b>" + esc(S[M.starts[0]].name) + "</b>, every later round where the last one ended.")}
      ${rule("Run", "Reach your own target. Trains, boats and buses run on a fixed timetable, so waiting counts. Tickets cost more the longer and faster the train.")}
      ${rule("Points", "Draw a challenge to earn KP: bronze +10, silver +20, gold +40. Every challenge takes " + CH_MIN + " min. You can veto a card, but then you are stuck: bronze 30 min, silver 45 min, gold 1 h. Failing costs the same. 15 kinds, from the stopwatch to the ticket machine.")}
      ${rule("Hunt", "The other three each hunt alone, with their own token. They ride free, know your target and see exactly where you are every " + G.PING + " min, starting after " + G.HEAD + " min.")}
      ${rule("Cards", "Everyone has their own deck. You start with 3 cards and draw 1 at every ping. Runner cards: strike, false trail, radio silence, weak signal, free ticket. Hunter cards: roadblock, extra ping, signal fault. Express works for both.")}
      ${rule("Score", "Reaching your target wins the round. Otherwise the minutes spent in your own zone count. Catches break ties.")}
    </div>
    <h3 style="margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)">Targets this match</h3><div class="goals">${goals}</div>
    <div class="btnrow"><button class="big" id="back"><b>Other map</b><small>Back to the map choice</small></button>
    <button class="big primary" id="go"><b>Start match</b><small>${PLAY2 ? esc(NAMES[0]) + " runs first" : "You run first"}</small></button></div>`);
  $("back").onclick = () => showIntro();
  $("go").onclick = () => { unstore(SAVE_KEY); hideOv(); resetMatch(); M.live = true; startRound(); };
}

/* ---------- settings screen ---------- */
function openSettings(back) {
  const row = (k, label, sub) => `<button class="setrow" data-k="${k}"><span><b>${label}</b><small>${sub}</small></span><i class="sw ${SET[k] ? "on" : ""}"></i></button>`;
  showOv(`<div class="tag">Settings</div><h2>Settings</h2>
    ${row("sound", "Sound", "Ping alarm, trains, challenges")}${row("vibe", "Vibration", "On pings and catches (Android phones)")}
    <h3 class="subh">Difficulty</h3>
    <div class="diffs">${Object.entries(DIFFS).map(([k, d]) => `<button class="pc ${SET.diff === k ? "on" : ""}" data-d="${k}"><b>${d.name}</b><small>${d.text}</small></button>`).join("")}</div>
    <p style="color:var(--mute);font-size:13px">A new difficulty starts with the next match.</p>
    <button class="big primary" id="setX"><b>Done</b></button>`);
  $("sheet").querySelectorAll(".setrow").forEach(b => b.onclick = () => { SET[b.dataset.k] = !SET[b.dataset.k]; store("escape-settings", SET); b.querySelector(".sw").classList.toggle("on", SET[b.dataset.k]); if (b.dataset.k === "sound" && SET.sound) SFX.chime(); });
  $("sheet").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { SET.diff = b.dataset.d; store("escape-settings", SET); $("sheet").querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", x === b)); });
  $("setX").onclick = () => back ? back() : hideOv();
}

/* ---------- save & resume ---------- */
const SAVE_KEY = "escape-save-v1";
function saveGame() {
  if (typeof document === "undefined" || !M || !M.live || !R || R.tutorial || R.forced) return;
  const rep = (k, v) => v instanceof Set ? {$set:[...v]} : (v && typeof v === "object" && PLAYERS.includes(v)) ? {$p:v.id} : v;
  try { store(SAVE_KEY, JSON.stringify({v:1, mode:G.mode, ping:G.PING, head:G.HEAD, play2:PLAY2, names:NAMES, M, R, at:Date.now()}, rep)); } catch (e) {}
}
function savedRaw() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
function savedInfo() {
  const raw = savedRaw(); if (!raw) return null;
  try { const d = JSON.parse(raw); return `${MODES[d.mode].label} · round ${d.M.round + 1} of 8${d.play2 ? " · 2 players" : ""}`; } catch (e) { return null; }
}
function resumeGame() {
  const raw = savedRaw(); if (!raw) return false;
  try {
    const head = JSON.parse(raw);
    setPlayers(head.play2, head.names);
    const d = JSON.parse(raw, (k, v) => v && typeof v === "object" && v.$p ? PLAYERS.find(p => p.id === v.$p) : v && typeof v === "object" && v.$set ? new Set(v.$set) : v);
    buildNet(d.mode); G.PING = d.ping; G.HEAD = d.head;
    M = d.M; R = d.R; UI.sel = null; UI.mode = null; UI.tab = "dep";
    hideOv(); focusMe(G.focus); render();
    if (R.status === "play" && PLAY2) showHandoff();
    return true;
  } catch (e) { unstore(SAVE_KEY); return false; }
}

/* ---------- tutorial ---------- */
let TUT = null;
const TUT_STEPS = [
  {sel:"#hud", text:() => `<b>Welcome to Ping Express!</b> You are the runner. Reach <b>${esc(S[R.goal].name)}</b> before the hunters catch you. The clock shows game time.`},
  {sel:".stage", text:() => `This is the rail map. You are the <b>blue dot</b> in ${esc(S[R.rn.node].name)}. <b>Orange stations</b> are trains you can take right now. Pinch or use + and − to zoom.`},
  {sel:"#targets", text:() => `Everyone has their own target. The coloured zones show which target is nearest. If you get caught, your minutes inside your own zone still count.`},
  {sel:".pingdial", text:() => `In a real match, three hunters wait ${G.HEAD} min. Then they see exactly where you are at every <b>ping</b>, even on a train (every ${G.PING} min). In this practice round they stay put.`},
  {sel:".s-kp", text:() => `Tickets cost <b>KP</b>. Faster and longer trains cost more. You have ${R.kp} KP.`},
  {sel:"#bQuiz", wait:"challenge", text:() => `Earn more KP with <b>challenges</b>: pick bronze, silver or gold, then accept or veto the card. Each one takes ${CH_MIN} min. Tap <b>Draw a challenge</b> and try one.`},
  {sel:"#bCards", text:() => `You also hold <b>cards</b>: strikes, false trails, free tickets, roadblocks. Every player has their own deck and draws a card at every ping.`},
  {sel:"#deck .dep.best", wait:"booked", text:() => `Last step: the <b>departures board</b>. The highlighted train is your fastest way to ${esc(S[R.goal].name)}. Tap it to buy the ticket and ride.`},
  {sel:"#deck .dep.best", wait:"never", final:true, text:() => `Keep going: take trains until you reach <b>${esc(S[R.goal].name)}</b>.`}
];
function startTutorial() {
  setPlayers(false);
  newMatch("ch");
  M.starts = ["LU", M.starts[1]]; M.goals[0] = "ZH";
  if (M.goals.slice(1).some(g => g === "ZH" || g === "LU")) M.goals = ["ZH", "GE", "LG", "SG"];
  Object.assign(M, zonesFor(M.goals));
  resetMatch(); M.round = 0;
  startRound();
  R.tutorial = true; R.hunters.forEach(h => h.frozen = 1e9);
  TUT = {i:0};
  hideOv(); focusMe(G.focus); render();
}
function tutEvent(name) { if (!TUT) return; const st = TUT_STEPS[TUT.i]; if (st && st.wait === name) { TUT.i++; tutApply(); } }
function tutApply() {
  if (typeof document === "undefined") return;
  document.querySelectorAll(".tut-hl").forEach(e => e.classList.remove("tut-hl"));
  let c = $("coach");
  if (!TUT || !R || !R.tutorial || R.status !== "play" || !$("ov").hidden) { if (c) c.hidden = true; return; }
  const st = TUT_STEPS[TUT.i]; if (!st) { if (c) c.hidden = true; return; }
  if (!c) { c = document.createElement("div"); c.id = "coach"; c.className = "coach"; document.querySelector(".screen").appendChild(c); }
  const el = document.querySelector(st.sel);
  if (el) el.classList.add("tut-hl");
  const real = TUT_STEPS.filter(x => !x.final).length;
  c.innerHTML = `<div class="row"><span class="n">${st.final ? "ALMOST THERE" : `STEP ${TUT.i + 1} OF ${real}`}</span><button class="lnk" id="tutSkip">Skip tutorial</button></div>
    <p>${st.text()}</p>${st.wait ? "" : `<button class="big primary" id="tutNext"><b>Next</b></button>`}`;
  c.hidden = false;
  if (el && el.scrollIntoView) try { el.scrollIntoView({block:"center", behavior:"smooth"}); } catch (e) {}
  const place = () => { if (!el) { c.className = "coach bot"; return; }
    const r = el.getBoundingClientRect(), vh = window.innerHeight || 800;
    c.className = "coach " + ((r.top + r.bottom) / 2 > vh / 2 ? "top" : "bot"); };
  place(); setTimeout(place, 450);
  $("tutSkip").onclick = () => { TUT = null; tutApply(); store("escape-tut", 1); showIntro(); };
  const nx = $("tutNext"); if (nx) nx.onclick = () => { TUT.i++; tutApply(); };
}
function tutFinish() {
  TUT = null; tutApply(); store("escape-tut", 1);
  showOv(`<div class="handoff"><div class="tag">Tutorial complete</div><div class="hoav" style="background:#62dd9b;box-shadow:0 0 0 6px #1d8a52">✓</div>
    <h2>You reached ${esc(S[R.goal].name)}!</h2>
    <p>In a real match the hunters move too. Watch the ping timer, keep enough KP for the next train, and use your cards when a hunter gets close.</p>
    <button class="big primary" id="tutGo"><b>Start a real match</b><small>Pick players and a map</small></button></div>`);
  SFX.arrived();
  $("tutGo").onclick = () => showIntro();
}

/* ---------- boot ---------- */
if (typeof document !== "undefined") { initMapControls(); const zs = $("zSet"); if (zs) zs.onclick = () => openSettings(); const zh = $("zHome"); if (zh) zh.onclick = () => { if (TUT) { TUT = null; tutApply(); } saveGame(); showIntro(); }; newMatch("ch"); startRound(); showIntro(); }
</script>
